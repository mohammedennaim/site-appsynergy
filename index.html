<!doctype html>

    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light only" />

    <!-- Favicon follows OS dark/light (Chrome ignores media= on icon links) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=6" />
    <script>
      (function () {
        var VERSION = '7';
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function setIcon(id, href, sizes) {
          var old = document.getElementById(id);
          if (old) old.parentNode.removeChild(old);
          var link = document.createElement('link');
          link.id = id;
          link.rel = 'icon';
          link.type = 'image/png';
          link.sizes = sizes;
          link.href = href + '?v=' + VERSION + '&t=' + Date.now();
          document.head.appendChild(link);
        }
        function applyFavicon() {
          var dark = mq.matches;
          setIcon('app-favicon', dark ? '/favicon-dark-32.png' : '/favicon-32.png', '32x32');
          setIcon('app-favicon-192', dark ? '/icon-dark-192.png' : '/icon-192.png', '192x192');
        }
        applyFavicon();
        try { mq.addEventListener('change', applyFavicon); }
        catch (_) { mq.addListener(applyFavicon); }
      })();
    </script>
